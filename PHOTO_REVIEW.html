<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Y2C V22 사진 원본·카테고리 대조</title><style>body{margin:0;background:#f6f3ee;color:#242424;font-family:Arial,'Malgun Gothic',sans-serif;padding:40px}main{max-width:1200px;margin:auto}h1{font-size:30px}p{line-height:1.8}.note{padding:20px;background:#fff;border-left:3px solid #b79550}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}figure{margin:0;background:white;padding:16px}img{width:100%;height:230px;object-fit:contain;background:#ece8e1}figcaption{font-size:13px;line-height:1.8}h2{font-size:19px}a{color:#725821}@media(max-width:800px){body{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Y2C V22 — 사진 원본·카테고리 대조표</h1><p class="note">인터넷 연결 상태에서 원본 사진을 불러옵니다. 이것은 최종 사이트 스크린샷이 아니라 사진 선별 대조표입니다. 실제 사이트에서는 명시한 주제에 맞춰 프레임을 정리합니다. GitHub 자동 배포는 사진을 다운로드·검증한 뒤 로컬 WebP로 포함합니다.</p><div class="grid"><figure><img src="https://images.pexels.com/photos/24244235/pexels-photo-24244235.jpeg?cs=srgb&amp;fm=jpg" alt="여러 색의 컨테이너가 정렬된 항만 터미널 전경" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>글로벌 사업 / 메인</h2><b>컨테이너 터미널 전경</b><p>전체 거래 환경의 참고 사진. Y2C 소유 항만·운송 실적을 뜻하지 않음.</p><p>Diego F. Parra · Pexels</p><a href="https://www.pexels.com/photo/aerial-view-of-containers-in-the-port-24244235/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/669613/pexels-photo-669613.jpeg?cs=srgb&amp;fm=jpg" alt="노트북 옆에 놓인 통계 차트와 조사 노트" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>해외시장조사</h2><b>통계 차트와 조사 노트</b><p>데이터 검토를 표현. 사진 속 차트는 실제 고객 보고서나 시장 수치가 아님.</p><p>Lukas Blazek · Pexels</p><a href="https://www.pexels.com/photo/notebook-and-charts-669613/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/7709097/pexels-photo-7709097.jpeg?cs=srgb&amp;fm=jpg" alt="비대면 영업 교신을 위한 노트북과 헤드셋" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>해외영업 대행</h2><b>노트북과 비즈니스 헤드셋</b><p>후속 교신·원격 업무를 표현. 콜센터 보유나 상시 인력 규모를 주장하지 않음.</p><p>MART PRODUCTION · Pexels</p><a href="https://www.pexels.com/photo/a-headset-hanging-on-a-laptop-7709097/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/35138560/pexels-photo-35138560.jpeg?cs=srgb&amp;fm=jpg" alt="기업 부스와 방문객이 보이는 전시회 전경" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>바이어 발굴</h2><b>기업 전시 부스 전경</b><p>후보 거래처 탐색 채널의 예시. 방문객은 원경이며 Y2C 참가 실적이나 고객이 아님.</p><p>Tahir Xəlfəquliyev · Pexels</p><a href="https://www.pexels.com/photo/modern-trade-show-exhibition-with-busy-attendees-35138560/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/6170102/pexels-photo-6170102.jpeg?cs=srgb&amp;fm=jpg" alt="화물 상자 위에서 확인하는 클립보드 문서" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>수출 컨설팅</h2><b>화물과 확인 문서</b><p>물품·서류 확인 업무 참고. 특정 통관 서식·자격보유·통관 완료를 주장하지 않음. 얼굴 미포함.</p><p>Tima Miroshnichenko · Pexels</p><a href="https://www.pexels.com/photo/clipboard-with-data-on-top-of-box-6170102/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/4483608/pexels-photo-4483608.jpeg?cs=srgb&amp;fm=jpg" alt="화물과 팔레트가 정돈된 창고 랙 통로" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>소싱·공급망</h2><b>재고가 적재된 창고 통로</b><p>보관·공급 흐름의 참고 사진. Y2C 보유 창고로 표시하지 않음.</p><p>Tiger Lily · Pexels</p><a href="https://www.pexels.com/photo/shelves-on-a-warehouse-4483608/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/30322395/pexels-photo-30322395.jpeg?cs=srgb&amp;fm=jpg" alt="테이블과 좌석 배치가 보이는 레스토랑 실내" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>프랜차이즈 사업개발</h2><b>테이블과 좌석이 배치된 매장</b><p>매장 콘셉트 참고. 실제 가맹 브랜드·계약 매장·Y2C 운영점이 아님.</p><p>Olaseni Omoare · Pexels</p><a href="https://www.pexels.com/photo/cozy-modern-restaurant-interior-with-empty-tables-30322395/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/28055130/pexels-photo-28055130.jpeg?cs=srgb&amp;fm=jpg" alt="차량 발판에 설치된 검은색 매트의 표면과 홈" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>차량용 매트</h2><b>차량 발판의 매트 표면</b><p>매트 종류 참고 사진. 사진만으로 TPE 재질·차종 적합성을 주장하지 않음. 실제 소싱 사양은 별도 확인.</p><p>Alexander Mass · Pexels</p><a href="https://www.pexels.com/photo/a-close-up-of-the-floor-mat-in-a-car-28055130/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/6872570/pexels-photo-6872570.jpeg?cs=srgb&amp;fm=jpg" alt="회색 극세사형 타월로 차량 표면을 닦는 장면" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>디테일링 용품</h2><b>차체를 닦는 디테일링 타월</b><p>실제 타월 사용 장면. 손만 포함. 사진으로 섬유 조성·GSM을 보증하지 않음.</p><p>Tima Miroshnichenko · Pexels</p><a href="https://www.pexels.com/photo/person-wiping-the-black-car-using-gray-fabric-6872570/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1768983298275-942312c9b446?auto=format&amp;fit=crop&amp;w=1600&amp;q=85" alt="차량 실내에 놓인 나무 캡과 유리병으로 된 방향제" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>차량용 방향제</h2><b>차량 실내의 병형 방향제</b><p>병형 방향제 사진. 송풍구형이나 Y2C 확정 브랜드라고 표기하지 않음. 향·성분·용량은 미확인.</p><p>zeliang xiao · Unsplash</p><a href="https://unsplash.com/photos/a-pyramid-shaped-car-air-freshener-with-liquid-inside-492ILSNVD-E" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://unsplash.com/license" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure><figure><img src="https://images.pexels.com/photos/9852698/pexels-photo-9852698.jpeg?cs=srgb&amp;fm=jpg" alt="틴팅 필름의 적용 부위인 차량 측면 유리 참고 사진" loading="lazy" referrerpolicy="no-referrer"><figcaption><h2>틴팅 필름</h2><b>차량 측면 유리 적용 환경</b><p>필름 원단·완제품 사진이 아니라 적용 부위 참고임을 카드에 별도 표시. 실제 부착 여부·투과율·차단 성능은 사진으로 판단하지 않음.</p><p>Иван Васючков · Pexels</p><a href="https://www.pexels.com/photo/close-up-photo-of-a-car-window-9852698/" target="_blank" rel="noopener noreferrer">원본 확인</a> / <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사용 조건</a></figcaption></figure></div></main></body></html>
